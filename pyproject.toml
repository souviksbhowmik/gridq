[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridq"
version = "0.1.0"
description = "QAOA load balancing for rural microgrids — QFF 2026 Quantum for Humanity hackathon (Climate track)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
